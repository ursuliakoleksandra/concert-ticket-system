worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;

    # У журналі видно, який вузол обробив запит і скільки часу це зайняло
    log_format balancer '$remote_addr "$request" $status '
                        'rt=$request_time urt=$upstream_response_time '
                        'upstream=$upstream_addr instance=$upstream_http_x_instance_id';
    access_log /var/log/nginx/access.log balancer;

    # Активний upstream-профіль (алгоритм балансування). Змінюється скриптом scripts/lb-switch.sh
    include /etc/nginx/upstreams/active.conf;

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            # HTTP/1.1 + keep-alive до вузлів (див. keepalive в upstream)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;   # з портом — для коректних URL у Swagger
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Пасивний health check: збій = помилка з'єднання, таймаут або 502/503/504.
            # Після max_fails збоїв за fail_timeout вузол виключається з пулу на fail_timeout.
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;

            # Повтор запиту на іншому вузлі. Неідемпотентні запити (POST) повторюються лише тоді,
            # коли запит ще не був надісланий вузлу (наприклад, з'єднання відхилено) — це
            # виключає подвійне виконання купівлі.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Адреса вузла, що відповів (для діагностики; X-Instance-ID додає сам застосунок)
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
