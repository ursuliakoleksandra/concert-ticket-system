# Least Connections: запит отримує вузол з найменшою кількістю активних з'єднань
upstream backend {
    zone backend 64k;
    least_conn;
    server app1:8080 resolve max_fails=2 fail_timeout=10s;
    server app2:8080 resolve max_fails=2 fail_timeout=10s;
    server app3:8080 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}
