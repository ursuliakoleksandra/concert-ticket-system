# Weighted Round Robin: імітація гетерогенних вузлів (app1 потужніший — вага 3)
upstream backend {
    zone backend 64k;
    server app1:8080 resolve weight=3 max_fails=2 fail_timeout=10s;
    server app2:8080 resolve weight=1 max_fails=2 fail_timeout=10s;
    server app3:8080 resolve weight=1 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
