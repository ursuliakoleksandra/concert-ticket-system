# Ticket Resale: Nginx (єдина точка входу) → 3 stateless-екземпляри API →
#   PostgreSQL primary + read replica (ЛР6), 2 шарди журналу операцій (ЛР7), Redis
#
#   docker compose up -d --build        — підняти весь стек
#   http://localhost:8080               — єдина зовнішня адреса (Nginx)
#
# Екземпляри API, PostgreSQL і Redis знаходяться лише у внутрішній мережі backend
# (internal: true) і не мають опублікованих портів.

x-app: &app
  build: .
  image: ticket-resale-app:latest
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    postgres-replica:
      condition: service_healthy
    shard-a:
      condition: service_healthy
    shard-b:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    # Spring Boot на 1 CPU стартує ~70 с; запас, щоб вузол не позначався unhealthy під час старту
    start_period: 150s
  # Однакові ліміти ресурсів для кожного вузла — для коректного scale-out експерименту
  cpus: "1.0"
  mem_limit: 768m
  stop_grace_period: 25s
  restart: unless-stopped

x-app-env: &app-env
  DB_URL: jdbc:postgresql://postgres:5432/ticket_resale
  DB_USER: resale
  DB_PASSWORD: resale
  REDIS_HOST: redis
  # ЛР4/ЛР5: кеш вмикається/вимикається без перезбирання образу
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  # ЛР5: для навантажувальних тестів ліміт піднімається, інакше k6 отримував би 429
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
  # ЛР6: репліка для читань; false — топологія Single Primary
  DB_REPLICA_URL: jdbc:postgresql://postgres-replica:5432/ticket_resale
  READ_REPLICA_ENABLED: ${READ_REPLICA_ENABLED:-true}
  READ_YOUR_WRITES_ENABLED: ${READ_YOUR_WRITES_ENABLED:-true}
  # ЛР7: шарди журналу операцій і функція маршрутизації (modulo | hash | consistent)
  SHARD_URLS: ${SHARD_URLS:-shard-a=jdbc:postgresql://shard-a:5432/ledger,shard-b=jdbc:postgresql://shard-b:5432/ledger}
  SHARD_STRATEGY: ${SHARD_STRATEGY:-consistent}
  # ЛР8: захист кешу статистики (none | lock), TTL Jitter, Negative Caching, «вартість» агрегації
  STATS_PROTECTION: ${STATS_PROTECTION:-lock}
  STATS_TTL: ${STATS_TTL:-30s}
  STATS_TTL_JITTER: ${STATS_TTL_JITTER:-0.2}
  NEGATIVE_CACHE: ${NEGATIVE_CACHE:-true}
  STATS_QUERY_COST: ${STATS_QUERY_COST:-200ms}

services:
  # ЛР6: Primary — приймає всі мутації; журнал WAL передається репліці потоковою реплікацією
  postgres:
    image: postgres:16-alpine
    container_name: resale-postgres
    command:
      - postgres
      - -c
      - hba_file=/replication/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Запас WAL на випадок короткочасного відставання репліки
      - -c
      - wal_keep_size=256MB
    environment:
      POSTGRES_DB: ticket_resale
      POSTGRES_USER: resale
      POSTGRES_PASSWORD: resale
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/replication:/replication:ro
    networks:
      - backend
    # ЛР6: однакові ресурси primary і replica — для чесного порівняння Single Primary і Primary + Replica
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resale -d ticket_resale"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ЛР6: Read Replica (Hot Standby) — асинхронно відтворює WAL з primary, відкрита лише для читання
  postgres-replica:
    image: postgres:16-alpine
    container_name: resale-postgres-replica
    user: postgres
    entrypoint: ["/bin/sh", "/replication/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      POSTGRES_DB: ticket_resale
      POSTGRES_USER: resale
      POSTGRES_PASSWORD: resale
      REPLICATION_PASSWORD: replicator
      # Штучна затримка застосування WAL (демонстрація Stale Read): 0 | 3s | 10s …
      REPLICA_APPLY_DELAY: ${REPLICA_APPLY_DELAY:-0}
    volumes:
      - pgreplica:/var/lib/postgresql/data
      - ./db/replication:/replication:ro
    networks:
      - backend
    cpus: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resale -d ticket_resale"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ЛР7: два незалежні шарди журналу операцій (ключ шардингу — user_id). Схему створює застосунок (Flyway)
  shard-a:
    image: postgres:16-alpine
    container_name: resale-shard-a
    environment: &shard-env
      POSTGRES_DB: ledger
      POSTGRES_USER: resale
      POSTGRES_PASSWORD: resale
    volumes:
      - shard-a-data:/var/lib/postgresql/data
    networks:
      - backend
    # Однакові ресурси шардів — щоб перевантаження одного шарду (Hot Shard) було видно
    cpus: "1.0"
    healthcheck: &shard-healthcheck
      test: ["CMD-SHELL", "pg_isready -U resale -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  shard-b:
    image: postgres:16-alpine
    container_name: resale-shard-b
    environment: *shard-env
    volumes:
      - shard-b-data:/var/lib/postgresql/data
    networks:
      - backend
    cpus: "1.0"
    healthcheck: *shard-healthcheck
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: resale-redis
    # AOF: бронювання переживають перезапуск Redis.
    # maxmemory + volatile-lru (ЛР4): при заповненні пам'яті витісняються найдавніше використані ключі
    # з TTL (кеш, бронювання, лічильники); ключі версій кешу без TTL не витісняються.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app1:
    <<: *app
    container_name: resale-app1
    hostname: app1
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    container_name: resale-app2
    hostname: app2
    environment:
      <<: *app-env
      INSTANCE_ID: app2
      # Синтетична затримка для експерименту з повільним вузлом (scripts/lab3-slow-node.sh)
      ARTIFICIAL_DELAY_MS: ${APP2_DELAY_MS:-0}

  app3:
    <<: *app
    container_name: resale-app3
    hostname: app3
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  nginx:
    # 1.27.3+ потрібна для параметра resolve в upstream (динамічні IP вузлів)
    image: nginx:1.27.5-alpine
    container_name: resale-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Каталог (а не окремий файл) — щоб зміна active.conf була видна без перестворення контейнера
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
    networks:
      - public
      - backend
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped

  # Генератор навантаження. Запускається лише явно: docker compose run --rm k6 run /scripts/<сценарій>.js
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    user: "0:0"
    # ЛР5: обмеження генератора навантаження, щоб він не конкурував із системою за всі ядра хоста
    cpus: "2.0"
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./load-tests:/scripts:ro
      - ./results:/results
    networks:
      - public

volumes:
  pgdata:
  pgreplica:
  shard-a-data:
  shard-b-data:
  redisdata:

networks:
  # Зовнішня мережа: клієнт ↔ балансувальник
  public:
    driver: bridge
  # Внутрішня мережа без виходу назовні: балансувальник ↔ API ↔ сховища
  backend:
    driver: bridge
    internal: true
