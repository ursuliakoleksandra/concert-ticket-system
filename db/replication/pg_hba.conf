# ЛР6. Правила автентифікації PostgreSQL для primary і replica (монтується як hba_file).
# TYPE  DATABASE     USER        ADDRESS        METHOD
# Локальні підключення всередині контейнера (healthcheck, psql, ініціалізація)
local   all          all                        trust
host    all          all         127.0.0.1/32   trust
host    all          all         ::1/128        trust
local   replication  all                        trust
# Потокова реплікація (WAL streaming) — лише окрема роль replicator з паролем
host    replication  replicator  all            scram-sha-256
# Застосунок і службові скрипти з мережі backend
host    all          all         all            scram-sha-256
